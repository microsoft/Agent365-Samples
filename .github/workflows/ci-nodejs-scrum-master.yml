name: CI - Scrum Master Scenario

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrum-master:
    name: Scrum Master (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scenarios/scrum-master
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Set up Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            scenarios/scrum-master/package-lock.json
            scenarios/scrum-master/azure-functions/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
      - name: Install timer dependencies
        run: npm ci
        working-directory: ./scenarios/scrum-master/azure-functions
      - name: Build timers
        run: npm run build
        working-directory: ./scenarios/scrum-master/azure-functions
