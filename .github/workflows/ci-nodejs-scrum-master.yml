name: CI - Scrum Master Scenario

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrum-master:
    name: Scrum Master (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./scenarios/scrum-master
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scenarios/scrum-master/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
