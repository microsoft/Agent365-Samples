name: CI - Build Node.js OpenAI Sample Agent

on:
  workflow_call:  # Called by orchestrator
  workflow_dispatch:  # Manual trigger

jobs:
  nodejs-openai-sampleagent:
    name: Node.js OpenAI Sample Agent
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nodejs/openai/sample-agent

    strategy:
      matrix:
        node-version: ['18', '20']

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Build
      run: npm run build

    - name: Verify business authentication contracts
      working-directory: .
      run: node --test --test-name-pattern="business (tool/OBO authorization|auth contract)" tests/observability/node-app-token.test.cjs