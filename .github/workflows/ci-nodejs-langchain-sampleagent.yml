name: CI - Build Node.js LangChain Sample Agent

on:
  workflow_call:  # Called by orchestrator
  workflow_dispatch:  # Manual trigger
jobs:
  nodejs-langchain-sampleagent:
    # Keeps the original check names for sample-agent ("Node.js LangChain Sample Agent (18)" / "(20)").
    name: ${{ matrix.display-name }} (${{ matrix.node-version }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nodejs/langchain/${{ matrix.sample }}

    strategy:
      matrix:
        include:
          - sample: sample-agent
            display-name: Node.js LangChain Sample Agent
            node-version: '18'
          - sample: sample-agent
            display-name: Node.js LangChain Sample Agent
            node-version: '20'
          - sample: travel-agent-aws
            display-name: Node.js LangChain Travel Agent AWS
            node-version: '24'

    steps:
    - name: Checkout repository
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    # travel-agent-aws compiles in its postinstall script, so npm install already built it.
    - name: Build
      if: matrix.sample != 'travel-agent-aws'
      run: npm run build

    - name: Test
      if: matrix.sample == 'travel-agent-aws'
      run: npm test