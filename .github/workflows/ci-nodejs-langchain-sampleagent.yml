name: CI - Build Node.js LangChain Sample Agent

on:
  workflow_call:  # Called by orchestrator
  workflow_dispatch:  # Manual trigger
jobs:
  nodejs-langchain-sampleagent:
    name: Node.js LangChain ${{ matrix.sample }} (Node ${{ matrix.node-version }})
    permissions:
      contents: read
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nodejs/langchain/${{ matrix.sample }}

    strategy:
      matrix:
        include:
          - sample: sample-agent
            node-version: '18'
          - sample: sample-agent
            node-version: '20'
          - sample: travel-agent-aws
            node-version: '24'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}

    - name: Install dependencies
      run: npm install

    - name: Build
      run: npm run build

    - name: Test
      if: matrix.sample == 'travel-agent-aws'
      run: npm test