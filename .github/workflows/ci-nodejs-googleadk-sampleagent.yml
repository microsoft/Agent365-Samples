name: CI - Test Node.js Google ADK Sample Agent

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  googleadk:
    name: Google ADK regression tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nodejs/google-adk/sample-agent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.12.0'
      - name: Install dependencies
        run: npm install
      - name: Build and run offline regression tests
        run: npm test
